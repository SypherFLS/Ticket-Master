services:
  backend:
    build: ./backend/
    env_file:
      - backend/.env
    ports:
      - "8080:8080"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tmaster"]
      interval: 2s
      timeout: 5s
      retries: 10

