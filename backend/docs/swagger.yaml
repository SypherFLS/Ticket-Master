basePath: /
definitions:
  tmaster_internal_constants.TicketStatus:
    enum:
    - new
    - pending
    - closed
    type: string
    x-enum-varnames:
    - StatusNew
    - StatusPending
    - StatusClosed
  tmaster_internal_dto.IDResponse:
    properties:
      ID:
        type: integer
    type: object
  tmaster_internal_dto.LoginDTO:
    properties:
      email:
        maxLength: 20
        minLength: 8
        type: string
      password:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  tmaster_internal_dto.OperatorTicketResponse:
    properties:
      claimed_at:
        type: string
      created_at:
        type: string
      decription:
        type: string
      id:
        type: integer
      status:
        $ref: '#/definitions/tmaster_internal_constants.TicketStatus'
      title:
        type: string
      user_id:
        type: integer
    type: object
  tmaster_internal_dto.RegisterDTO:
    properties:
      email:
        maxLength: 20
        minLength: 8
        type: string
      name:
        maxLength: 15
        minLength: 5
        type: string
      password:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  tmaster_internal_dto.TicketDTO:
    properties:
      decription:
        type: string
      title:
        maxLength: 30
        minLength: 5
        type: string
    required:
    - title
    type: object
  tmaster_internal_dto.UserTicketResponse:
    properties:
      claimed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      operator_id:
        type: integer
      status:
        $ref: '#/definitions/tmaster_internal_constants.TicketStatus'
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for user registration and ticket workflow management.
  title: Ticket Master API
  version: "1.0"
paths:
  /api/claim:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tmaster_internal_dto.OperatorTicketResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Claim next ticket
      tags:
      - tickets
  /api/close:
    patch:
      produces:
      - application/json
      responses:
        "204":
          description: Ticket closed
          schema:
            type: string
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Close ticket
      tags:
      - tickets
  /api/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Ticket payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tmaster_internal_dto.TicketDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tmaster_internal_dto.IDResponse'
        "400":
          description: Validation or parse error
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create ticket
      tags:
      - tickets
  /api/tickets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tmaster_internal_dto.UserTicketResponse'
            type: array
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List own tickets
      tags:
      - tickets
  /api/tickets_queue:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tmaster_internal_dto.OperatorTicketResponse'
            type: array
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List new tickets queue
      tags:
      - tickets
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tmaster_internal_dto.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token
          schema:
            type: string
        "400":
          description: Validation or parse error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tmaster_internal_dto.RegisterDTO'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            type: string
        "400":
          description: Validation or parse error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: User already exists
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register user
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
